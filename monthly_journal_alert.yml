# 저장 위치: 저장소 안에서 반드시 이 경로여야 합니다
#   .github/workflows/monthly_journal_alert.yml
#
# 이 파일이 있으면 GitHub가 알아서 정해진 시각에 서버를 하나 켜서
# monthly_journal_alert.py 를 실행하고, 끝나면 서버를 꺼줍니다.
# 내 컴퓨터는 켜져 있을 필요가 전혀 없습니다.

name: Monthly Journal Alert

on:
  schedule:
    # cron은 UTC(세계표준시) 기준입니다. 한국은 UTC+9시간이므로,
    # "한국시간 매달 첫째주 월요일 오전 9시"에 맞추려면
    # 매주 월요일 UTC 0시(=한국 오전 9시)에 실행되게 걸어두고,
    # 파이썬 코드 안에서 "이번 달 첫째 주인지" 다시 한 번 걸러줍니다.
    - cron: "0 0 * * 1"
  workflow_dispatch:
    # 이 줄 덕분에 GitHub 저장소의 Actions 탭에서
    # "Run workflow" 버튼을 눌러 언제든 수동으로도 테스트 실행할 수 있습니다.

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 스크립트 실행
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBMED_EMAIL: ${{ secrets.PUBMED_EMAIL }}
        run: python monthly_journal_alert.py
